name = "howmanycoin-rate"
main = "src/rate.ts"
compatibility_date = "2026-04-22"
compatibility_flags = ["nodejs_compat"]

[vars]
ONEINCH_REFERRER = "0x0000000000000000000000000000000000000000"
JUPITER_PLATFORM_FEE_BPS = "20"
JUPITER_FEE_ACCOUNT = ""

[env.production]
name = "howmanycoin-rate-prod"

[env.production.vars]
ONEINCH_REFERRER = ""
JUPITER_FEE_ACCOUNT = ""

# Route all /api/rate requests on the custom domain and pages.dev subdomains
# The Worker handles /api/rate on any hostname via the Pages project's reverse-proxy config.
[[routes]]
pattern = "howmanycoin.com/api/rate"
zone_name = "howmanycoin.com"

[[routes]]
pattern = "www.howmanycoin.com/api/rate"
zone_name = "howmanycoin.com"

# Route /api/rate on the custom domain and www subdomain
# The pages.dev subdomains will be served by the Pages project directly
# when the Worker's routes don't match.

[observability]
enabled = true
